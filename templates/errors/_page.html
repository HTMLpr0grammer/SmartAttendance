{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} · SmartAttendance</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f1f5f9;color:#0f172a}
    .card{max-width:420px;width:100%;background:#fff;border-radius:16px;padding:32px 24px;text-align:center;
      box-shadow:0 10px 30px rgba(15,23,42,.08)}
    img{height:64px;width:64px;object-fit:contain}
    .code{font-size:44px;font-weight:800;margin:12px 0 4px;color:#1e3a8a}
    h1{font-size:18px;margin:0 0 8px}
    p{font-size:14px;color:#475569;margin:0 0 20px;line-height:1.5}
    a{display:inline-block;background:#1e3a8a;color:#fff;text-decoration:none;padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <img src="{% static 'images/zdspgc_logo.png' %}" alt="ZDSPGC logo">
    <div class="code">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a href="/">Back to SmartAttendance</a>
  </main>
</body>
</html>
