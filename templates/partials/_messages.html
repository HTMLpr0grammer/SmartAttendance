{% if messages %}
<div class="mx-auto w-full max-w-7xl space-y-2 px-4 pt-4 sm:px-6 lg:px-8">
  {% for message in messages %}
  <div class="flex items-start justify-between gap-3 rounded-xl border px-4 py-3 text-sm shadow-sm
    {% if message.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-800
    {% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800
    {% elif message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800
    {% else %}border-sky-200 bg-sky-50 text-sky-800{% endif %}" data-dismissible>
    <span>{{ message }}</span>
    <button type="button" class="opacity-60 hover:opacity-100" data-dismiss aria-label="Dismiss">&times;</button>
  </div>
  {% endfor %}
</div>
{% endif %}
