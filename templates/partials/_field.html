<div>
  <label for="{{ field.id_for_label }}" class="mb-1.5 block text-sm font-medium text-slate-700">{{ field.label }}{% if field.field.required %} <span class="text-rose-500">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text and not field.errors %}<div class="mt-1 text-xs text-slate-500 [&_ul]:list-disc [&_ul]:pl-4">{{ field.help_text|safe }}</div>{% endif %}
  {% for e in field.errors %}<p class="mt-1 text-xs text-rose-600">{{ e }}</p>{% endfor %}
</div>
