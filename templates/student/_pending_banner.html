  <span class="mt-0.5 text-xl">⏳</span>
  <div>
    <p class="font-bold">Account Pending Verification: Awaiting enrollment from your instructor.</p>
    <p class="mt-0.5 text-sm text-amber-800">You can still scan your class QR code — your instructor will see your scan and can add you to the class with one tap.</p>
  </div>
</div>
{% endif %}
